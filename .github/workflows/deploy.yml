name: Deploy to AWS (S3 + CloudFront)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # No-op with a clear message until the one-time bootstrap in infra/README.md
  # has been done: the AWS_ROLE_ARN secret and the two repo variables come
  # from the CloudFormation stack outputs.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          missing=""
          [ -n "$AWS_ROLE_ARN" ] || missing="$missing secret:AWS_ROLE_ARN"
          [ -n "$S3_BUCKET" ] || missing="$missing var:S3_BUCKET"
          [ -n "$CLOUDFRONT_DISTRIBUTION_ID" ] || missing="$missing var:CLOUDFRONT_DISTRIBUTION_ID"
          if [ -n "$missing" ]; then
            echo "::notice title=Deploy skipped::Not configured yet. Missing:$missing. See infra/README.md for the bootstrap."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    env:
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          # CloudFront serves from the root (also on a custom domain).
          BASE_PATH: /
          # Editor stack outputs (infra/README.md); empty until that stack
          # exists, in which case /admin.html shows "editor not configured".
          VITE_EDITOR_API_URL: ${{ vars.EDITOR_API_URL }}
          VITE_EDITOR_REGION: ${{ vars.EDITOR_REGION }}
          VITE_EDITOR_USER_POOL_ID: ${{ vars.EDITOR_USER_POOL_ID }}
          VITE_EDITOR_CLIENT_ID: ${{ vars.EDITOR_CLIENT_ID }}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # Hashed bundles/fonts: filename changes when content does, so cache forever.
      - name: Sync hashed assets (immutable)
        run: >
          aws s3 sync dist/assets/ "s3://$S3_BUCKET/assets/"
          --delete
          --cache-control "public, max-age=31536000, immutable"

      # Everything else that is not fingerprinted (Doré textures, icons):
      # a day in cache, invalidated below when it changes. content/* is the
      # editor's (infra/editor.yml), never in dist/, so --delete must skip it.
      - name: Sync unhashed files (1 day)
        run: >
          aws s3 sync dist/ "s3://$S3_BUCKET/"
          --delete
          --exclude "assets/*"
          --exclude "index.html"
          --exclude "admin.html"
          --exclude "content/*"
          --cache-control "public, max-age=86400"

      # The admin page is a second entry (src/admin); short cache like index.html.
      - name: Upload admin.html (60s, revalidate)
        run: >
          aws s3 cp dist/admin.html "s3://$S3_BUCKET/admin.html"
          --cache-control "public, max-age=60, must-revalidate"

      # index.html last, so it never references an asset that is not there yet.
      - name: Upload index.html (60s, revalidate)
        run: >
          aws s3 cp dist/index.html "s3://$S3_BUCKET/index.html"
          --cache-control "public, max-age=60, must-revalidate"

      - name: Invalidate CloudFront
        run: >
          aws cloudfront create-invalidation
          --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID"
          --paths "/" "/index.html" "/admin.html" "/dore/*"
