<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- the build puts an inline script here, ahead of the bundle, that
         preloads every texture of the device's tier and the engine chunk
         (the head-preload plugin in vite.config.ts, src/device/tierPreload.ts) -->
    <title>Grace City Collective</title>
  </head>
  <body>
    <!-- the intro splash is injected here as static markup by the
         static-splash plugin in vite.config.ts, so it is on screen before the
         bundle arrives (src/features/intro/staticSplash.ts) -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
